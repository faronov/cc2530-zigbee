name: SDCC CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac-radio:
    name: Offline composed services (${{ matrix.board }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        board: [generic, lg_esl29_rev03]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned SDCC toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends \
            build-essential python3 sdcc=4.2.0+dfsg-1 sdcc-ucsim=4.2.0+dfsg-1

      - name: Test clock/radio, timestamps, reporting, staged association and ZDO
        env:
          BOARD: ${{ matrix.board }}
        run: make BOARD="$BOARD" BUILD="build/$BOARD/compositions" test-mac-radio test-mac-stamp test-zcl-temperature test-mac-join test-zdo-node test-zdo-srv

  mac-attempt:
    name: Offline MAC interval owner (${{ matrix.board }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        board: [generic, lg_esl29_rev03]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned SDCC toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends \
            build-essential python3 sdcc=4.2.0+dfsg-1 sdcc-ucsim=4.2.0+dfsg-1

      - name: Test genuine interval attempt and complete MMIO replay
        env:
          BOARD: ${{ matrix.board }}
        run: make BOARD="$BOARD" BUILD="build/$BOARD/mac-attempt" test-mac-attempt

  zigbee-security:
    name: Offline Zigbee security (${{ matrix.board }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        board: [generic, lg_esl29_rev03]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned SDCC toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends \
            build-essential python3 sdcc=4.2.0+dfsg-1 sdcc-ucsim=4.2.0+dfsg-1

      - name: Test genuine CCM, secured NWK APS, install codes and keyed hashes with AES DMA
        env:
          BOARD: ${{ matrix.board }}
        run: make BOARD="$BOARD" BUILD="build/$BOARD/security" test-zigbee-security test-zigbee-mmo test-zigbee-key-hash

  security-counter:
    name: Offline durable counters (${{ matrix.board }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        board: [generic, lg_esl29_rev03]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned SDCC toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends \
            build-essential python3 sdcc=4.2.0+dfsg-1 sdcc-ucsim=4.2.0+dfsg-1

      - name: Test durable counter ranges with the actual journal and flash driver
        env:
          BOARD: ${{ matrix.board }}
        run: make BOARD="$BOARD" BUILD="build/$BOARD/counters" test-security-counter

  security-resident:
    name: Offline resident crypto NV (${{ matrix.board }}, ${{ matrix.profile }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        board: [generic, lg_esl29_rev03]
        profile: [security, mmo, key-hash, counter]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned SDCC toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends \
            build-essential python3 sdcc=4.2.0+dfsg-1 sdcc-ucsim=4.2.0+dfsg-1

      - name: Test real resident crypto and NV with checked active DATA frames
        env:
          BOARD: ${{ matrix.board }}
          PROFILE: ${{ matrix.profile }}
        run: make BOARD="$BOARD" BUILD="build/$BOARD/resident-$PROFILE" "test-security-resident-$PROFILE"

  bootstrap:
    name: Offline board fixture (${{ matrix.board }}, ${{ matrix.image }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        board: [generic, lg_esl29_rev03]
        image: [bringup, debug_fixture, timebase_fixture, clock_fixture, irq_fixture, radio_fifo_fixture, dma_fixture, aes_fixture, prng_fixture, radio_rx_fixture, flash_fixture, radio_tx_fixture, radio_noise_fixture, radio_link_fixture]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned SDCC toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends \
            build-essential python3 python3-venv tcl8.6 \
            sdcc=4.2.0+dfsg-1 sdcc-ucsim=4.2.0+dfsg-1
          sdcc --version
          python3 --version
          cc --version

      - name: Check repository policy and documentation links
        run: |
          python3 tools/check_repository.py

      - name: Check host tool regressions
        if: matrix.board == 'generic' && matrix.image == 'bringup'
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v

      - name: Test optional PyUSB resource management without hardware
        if: matrix.board == 'generic' && matrix.image == 'bringup'
        run: |
          python3 -m venv build/usb-tests
          build/usb-tests/bin/python -m pip install --disable-pip-version-check -r requirements-debug.txt
          build/usb-tests/bin/python -m unittest discover -s tools -p 'test_m1_*.py' -v

      - name: Build, check images and execute tests
        env:
          BOARD: ${{ matrix.board }}
          IMAGE: ${{ matrix.image }}
          BUILD: build/${{ matrix.board }}/${{ matrix.image }}
        run: |
          make BOARD="$BOARD" IMAGE="$IMAGE" BUILD="$BUILD" all test-board
          if [ "$IMAGE" = debug_fixture ]; then
            make BOARD="$BOARD" IMAGE="$IMAGE" BUILD="$BUILD" test-common-core
          fi

      - name: Upload generated board artifacts (never hardware-tested by CI)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cc2530-${{ matrix.image }}-${{ matrix.board }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/${{ matrix.board }}/${{ matrix.image }}/${{ matrix.image }}.hex
            build/${{ matrix.board }}/${{ matrix.image }}/${{ matrix.image }}.bin
            build/${{ matrix.board }}/${{ matrix.image }}/${{ matrix.image }}.ihx
            build/${{ matrix.board }}/${{ matrix.image }}/${{ matrix.image }}.map
            build/${{ matrix.board }}/${{ matrix.image }}/${{ matrix.image }}.mem
            build/${{ matrix.board }}/${{ matrix.image }}/${{ matrix.image }}.cdb
            build/${{ matrix.board }}/${{ matrix.image }}/build-info.json
