name: SDCC CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  plan:
    name: Check selection and publication policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      count: ${{ steps.select.outputs.count }}
      campaign: ${{ steps.select.outputs.campaign }}
    steps:
      - name: Check out source and complete comparison history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check repository policy, documentation and selection regressions
        run: |
          python3 -B tools/check_repository.py
          python3 -B -m unittest discover -s tools -p 'test_ci_plan.py' -v

      - name: Select complete affected consumers or conservative full acceptance
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/ci_plan.py --github

  checks:
    name: ${{ matrix.name }}
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned SDCC toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends \
            build-essential python3 python3-venv tcl8.6 \
            sdcc=4.2.0+dfsg-1 sdcc-ucsim=4.2.0+dfsg-1

      - name: Check host tool regressions
        if: matrix.tools
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v

      - name: Test optional PyUSB resource management without hardware
        if: matrix.tools
        run: |
          python3 -m venv build/usb-tests
          build/usb-tests/bin/python -m pip install --disable-pip-version-check -r requirements-debug.txt
          build/usb-tests/bin/python -m unittest discover -s tools -p 'test_m1_*.py' -v

      - name: Build, check images and execute selected complete corpora
        env:
          BOARD: ${{ matrix.board }}
          IMAGE: ${{ matrix.image || 'bringup' }}
          BUILD: build/${{ matrix.board }}/${{ matrix.directory }}
          TARGETS: ${{ matrix.targets }}
          ARTIFACT_CAMPAIGN: ${{ needs.plan.outputs.campaign }}
        run: |
          read -r -a targets <<< "$TARGETS"
          make -j1 BOARD="$BOARD" IMAGE="$IMAGE" BUILD="$BUILD" \
            ARTIFACT_CAMPAIGN="$ARTIFACT_CAMPAIGN" "${targets[@]}"

      - name: Report real host branch coverage without uploading instrumented artifacts
        if: matrix.coverage
        env:
          BOARD: ${{ matrix.board }}
        run: make -j1 BOARD="$BOARD" BUILD="build/$BOARD/host-coverage" test-coverage

      - name: Upload generated board artifacts (never hardware-tested by CI)
        if: matrix.image != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cc2530-${{ matrix.image }}-${{ matrix.board }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/${{ matrix.board }}/${{ matrix.image }}/${{ matrix.image }}.hex
            build/${{ matrix.board }}/${{ matrix.image }}/${{ matrix.image }}.bin
            build/${{ matrix.board }}/${{ matrix.image }}/${{ matrix.image }}.ihx
            build/${{ matrix.board }}/${{ matrix.image }}/${{ matrix.image }}.map
            build/${{ matrix.board }}/${{ matrix.image }}/${{ matrix.image }}.mem
            build/${{ matrix.board }}/${{ matrix.image }}/${{ matrix.image }}.cdb
            build/${{ matrix.board }}/${{ matrix.image }}/build-info.json

  overlay:
    name: Opt-in XDATA overlay and complete join release gate
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stock feature-off toolchain and simulator build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends \
            build-essential python3 bison flex m4 libboost-dev zlib1g-dev \
            sdcc=4.2.0+dfsg-1 sdcc-ucsim=4.2.0+dfsg-1

      - name: Prove feature-off primary artifacts still match the original baseline
        run: |
          make -s -j2 BOARD=lg_esl29_rev03 JOIN_SMOKE_KEY_MODE=default-tc \
            BUILD=build/feature-off prepare-join-smoke-stack test-join-smoke-host
          PYTHONPATH=tools:tests python3 -B - <<'PY'
          from pathlib import Path
          from xdata_overlay import verify_study
          from verify_firmware import require
          root = Path("build/feature-off")
          require(not Path("build/toolchains").exists(), "Feature-off prepared the custom toolchain")
          require(not list(root.rglob("*.xdata.json")), "Feature-off generated compiler metadata")
          require(not list(root.rglob("xdata-overlay.json")), "Feature-off invoked the overlay")
          artifacts, proof = verify_study(root / "join-smoke-layout", "lg_esl29_rev03", "default-tc")
          require(artifacts[1]["l_XSEG"] == 7676, "Feature-off physical XDATA changed")
          print("All nine original baseline identities and DATA/stack proofs PASS; no overlay")
          PY

      - name: Cache only the exact pinned compiler release
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/toolchains/sdcc-xdata
          key: sdcc-xdata-linux-x86_64-${{ hashFiles('tools/xdata_toolchain_pins.json') }}

      - name: Download or revalidate the pinned release and behavior probe
        run: make -s prepare-xdata-toolchain

      - name: Reproduce the debugger-only simulator
        run: |
          curl --fail --location --retry 3 \
            https://deb.debian.org/debian/pool/main/s/sdcc/sdcc_4.2.0+dfsg.orig.tar.xz \
            --output build/sdcc_4.2.0+dfsg.orig.tar.xz
          python3 -B tools/prepare_join_simulator.py \
            --archive build/sdcc_4.2.0+dfsg.orig.tar.xz --output build/join-simulator

      - name: Build and release-gate the enabled primary image
        run: |
          make -s BOARD=lg_esl29_rev03 JOIN_SMOKE_KEY_MODE=default-tc BUILD=build/overlay \
            S51="$PWD/build/join-simulator/sdcc-4.2.0+dfsg/sim/ucsim/s51.src/s51" \
            test-join-smoke-overlay

      - name: Retain public synthetic acceptance summary, never hardware captures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xdata-overlay-acceptance-${{ github.sha }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
          path: |
            build/overlay/xdata-overlay/.generations/image-*/receipt.json
            build/overlay/xdata-overlay/.generations/image-*/build.log
            build/overlay/xdata-overlay/.generations/image-*/acceptance-*/acceptance.json
            build/overlay/xdata-overlay/.generations/image-*/acceptance-*/progress.json
            build/overlay/xdata-overlay/.generations/image-*/acceptance-*/*.log

  acceptance:
    name: Required offline acceptance
    if: always()
    needs: [plan, checks, overlay]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out acceptance gate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reject failed, cancelled or unexpectedly skipped validation
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          WORKER_RESULT: ${{ needs.checks.result }}
          OVERLAY_RESULT: ${{ needs.overlay.result }}
          COUNT: ${{ needs.plan.outputs.count }}
        run: |
          python3 -B tools/ci_plan.py --check-result "$PLAN_RESULT" "$WORKER_RESULT" "$COUNT"
          python3 -B tools/ci_plan.py --check-result "$PLAN_RESULT" "$OVERLAY_RESULT" "$COUNT"

  compiler-source:
    name: Independent source/release compiler equivalence
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    uses: ./.github/workflows/xdata-source.yml
