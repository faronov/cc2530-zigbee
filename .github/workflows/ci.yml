name: SDCC CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    name: Offline board fixture (${{ matrix.board }}, ${{ matrix.image }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        board: [generic, lg_esl29_rev03]
        image: [bringup, debug_fixture, timebase_fixture, clock_fixture, irq_fixture, radio_fifo_fixture, dma_fixture, aes_fixture, prng_fixture, radio_rx_fixture, flash_fixture, radio_tx_fixture]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned SDCC toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends \
            build-essential python3 python3-venv \
            sdcc=4.2.0+dfsg-1 sdcc-ucsim=4.2.0+dfsg-1
          sdcc --version
          python3 --version
          cc --version

      - name: Check repository policy and documentation links
        run: |
          python3 tools/check_repository.py

      - name: Check host tool regressions
        if: matrix.board == 'generic' && matrix.image == 'bringup'
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v

      - name: Test optional PyUSB resource management without hardware
        if: matrix.board == 'generic' && matrix.image == 'bringup'
        run: |
          python3 -m venv build/usb-tests
          build/usb-tests/bin/python -m pip install --disable-pip-version-check -r requirements-debug.txt
          build/usb-tests/bin/python -m unittest discover -s tools -p 'test_m1_*.py' -v

      - name: Build, check images and execute tests
        env:
          BOARD: ${{ matrix.board }}
          IMAGE: ${{ matrix.image }}
          BUILD: build/${{ matrix.board }}/${{ matrix.image }}
        run: |
          make BOARD="$BOARD" IMAGE="$IMAGE" BUILD="$BUILD" all test-board
          if [ "$IMAGE" = debug_fixture ]; then
            make BOARD="$BOARD" IMAGE="$IMAGE" BUILD="$BUILD" test-common
          fi

      - name: Upload generated board artifacts (never hardware-tested by CI)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cc2530-${{ matrix.image }}-${{ matrix.board }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/${{ matrix.board }}/${{ matrix.image }}/${{ matrix.image }}.hex
            build/${{ matrix.board }}/${{ matrix.image }}/${{ matrix.image }}.bin
            build/${{ matrix.board }}/${{ matrix.image }}/${{ matrix.image }}.ihx
            build/${{ matrix.board }}/${{ matrix.image }}/${{ matrix.image }}.map
            build/${{ matrix.board }}/${{ matrix.image }}/${{ matrix.image }}.mem
            build/${{ matrix.board }}/${{ matrix.image }}/${{ matrix.image }}.cdb
            build/${{ matrix.board }}/${{ matrix.image }}/build-info.json
